name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages on every push.
# The two PUBLIC Supabase values are injected at build time from repo-level
# Actions Variables (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# (These are safe to expose — they only grant what your auth/RLS allow. Your
#  Gemini key is NOT here; it lives in the Supabase Edge Function.)

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
